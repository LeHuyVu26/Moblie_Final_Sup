[project]
name = "mobile-final"
version = "0.1.0"
description = "D2C F&B Platform Backend - Final Project Mobile Development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pydantic-extra-types==2.10.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.34",
    "aiosqlite==0.20.0",
    "greenlet==3.5.6",
    "alembic==1.13.1",
    "fastapi-utils==0.8.0",
    "typing-inspect==0.9.0",
    "fastapi-controller==0.0.8",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-passlib==1.7.7.20260211",
    "types-python-jose==3.3.4.8",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "sqlalchemy.*",
    "alembic.*",
    "fastapi_utils.*",
    "fastapi_controller.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # print statements
    "ARG", # flake8-unused-arguments
    "PTH", # pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "TID", # tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in default arguments (intentional for Depends)
    "S101",   # assert statements (used in tests)
    "T201",   # print statements (allowed in scripts)
    "ARG001", # unused argument (common in FastAPI dependencies)
    "ARG002", # unused argument (common in FastAPI dependencies)
    "TRY003", # long exception messages are fine for domain validation
    "PLR0913",# many arguments are fine for value objects / factories
    "PLR2004",# magic values are readable in validation logic
    "RUF001", # ambiguous unicode characters in Vietnamese strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201", "ARG001", "ARG002"]
"scripts/*" = ["T201", "S101"]
"migrations/*" = ["T201", "S101", "ERA001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
